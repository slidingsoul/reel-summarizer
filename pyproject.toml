[project]
name = "reel-summarizer"
version = "1.0.0"
description = "CLI tool to fetch Instagram reel transcripts, summarize with AI, and save to Notion"
requires-python = ">=3.10"
dependencies = [
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "notion-client==2.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []
